name: "[REFERENCE ONLY] Phase 3 CI/CD — not auto-executed by GitHub"

# =============================================================
# ⚠️  THIS FILE IS A REFERENCE COPY — IT DOES NOT AUTO-RUN.
# =============================================================
# GitHub Actions only discovers and executes workflow files
# that live directly under the REPOSITORY ROOT at:
#   .github/workflows/
#
# This file is located at:
#   phase3-advanced/.github/workflows/ci-cd.yml
#
# GitHub will NEVER automatically trigger it. It exists here
# purely for educational reference — to keep the Phase 3
# pipeline logic co-located with the Phase 3 application code.
#
# THE EXECUTABLE WORKFLOW IS AT:
#   .github/workflows/ci-cd.yml   ← this is what GitHub runs
# =============================================================

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "phase3-advanced/**"
  pull_request:
    branches: ["main"]
    paths:
      - "phase3-advanced/**"

defaults:
  run:
    working-directory: phase3-advanced

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: docker-mastery
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  # ===========================================================
  # JOB 1 — Lint & Test
  # ===========================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app test_main.py --max-line-length=100

      - name: Run pytest
        run: pytest -v

  # ===========================================================
  # JOB 2 — Build → Scan → Push
  # ===========================================================
  build-scan-push:
    name: Build, Scan & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context: phase3-advanced (where the Dockerfile lives)
      - name: Build image (cached, local only — not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: phase3-advanced
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      # Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          DH_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }} "$DH_REPO:${{ steps.meta.outputs.sha_tag }}"
          docker tag ${{ env.IMAGE_NAME }}:latest "$DH_REPO:latest"
          docker push "$DH_REPO:${{ steps.meta.outputs.sha_tag }}"
          docker push "$DH_REPO:latest"
          if [ -n "${{ steps.meta.outputs.version_tag }}" ]; then
            docker tag ${{ env.IMAGE_NAME }}:latest "$DH_REPO:${{ steps.meta.outputs.version_tag }}"
            docker push "$DH_REPO:${{ steps.meta.outputs.version_tag }}"
          fi

      # AWS ECR via OIDC
      # IAM role : arn:aws:iam::007924090234:role/github-actions-ecr-role
      # ECR repo : arn:aws:ecr:ap-south-1:007924090234:repository/docker-mastery
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-ecr-push

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to Amazon ECR
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }} "$ECR_REPO:${{ steps.meta.outputs.sha_tag }}"
          docker tag ${{ env.IMAGE_NAME }}:latest "$ECR_REPO:latest"
          docker push "$ECR_REPO:${{ steps.meta.outputs.sha_tag }}"
          docker push "$ECR_REPO:latest"
          if [ -n "${{ steps.meta.outputs.version_tag }}" ]; then
            docker tag ${{ env.IMAGE_NAME }}:latest "$ECR_REPO:${{ steps.meta.outputs.version_tag }}"
            docker push "$ECR_REPO:${{ steps.meta.outputs.version_tag }}"
          fi
